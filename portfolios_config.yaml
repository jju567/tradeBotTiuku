# System Global Configuration
account_tax_profile: "AOT"          # "AOT" (Henkilökohtainen AOT: P12 allokaatio 5k, verokiilan minimointi) tai "OY" (Yritys/Vakuutuskuori: P12 10k, vapaa kasvu)
order_routing:
  enforce_limit_only: true         # Ehdoton Market-toimeksiantojen kielto (Market Impact / Slippage -suoja)
  limit_buffer_pct: 0.002          # Max +0.2% edellisen kynttilän päätöskurssiin / VWAP-hintaan
  time_in_force: "FOK_15MIN"       # Fill-Or-Kill / 15 minuutin aikaraja, jos hinta karkaa tilaus perutaan

