        allocated_capital: 1185
        slots: 1
        slot_sizes: [1185]
        universe_filter: "Nordic_MicroCap_Catalyst"
        trial_protocol:
          thesis: "Neglected, profitable Nordic small-caps (.HE / liquid .ST) with verified <= 6 analysts and sufficient EUR turnover"
          duration_months: 12
          max_duration_months: 24
          benchmark_ticker: "OMXSSCGI"
          benchmark_etf_proxy: "XACT-SMABOLAG.ST"
          benchmark_type: "NORDIC_SMALLCAP_TOTAL_RETURN_GI"
          track_fees_and_fx_separately: true
          kill_switch_criteria:
            evaluation_boolean_logic: "IMMEDIATE_OR_HARD_STOPS_PLUS_12M_AND_SAMPLE_CHECK"
            max_roundtrips_per_year: 1
            min_target_holding_days: 120
            immediate_or_hard_stops:
              max_sub_strategy_drawdown_pct: -25.0
              max_annual_direct_broker_and_fx_drag_pct: 3.5
              max_annual_all_in_cost_with_spread_pct: 5.5
            periodic_and_evaluation:
              min_duration_months: 12
              min_combined_paper_and_live_trades: 15
              max_net_underperformance_vs_smallcap_gi_pct: -10.0
        rules:
          - "Thesis: Neglected, profitable Nordic small-caps (verified <= 6 analysts, positive ROE/EBIT/FCF, .HE or liquid .ST)"
          - "Trial_Protocol: 12-24 month paper + 1,185 EUR live trial benchmarked against Nordic Small-Cap Total Return GI (OMXSSCGI / XACT-SMABOLAG.ST) net of all broker & FX fees"
          - "Turnover_Guard: Max 1 round-trip/yr in live slot (time-stop extended to 120 trading days) so direct broker+FX drag stays <= 3.5%/yr and all-in cost with spread stays <= 5.5%/yr"
          - "Kill_Switch: Immediate OR stop if drawdown < -25%, direct broker+FX drag > 3.5%/yr, or all-in cost > 5.5%/yr; OR after (12m AND >= 15 combined paper+live trades) if net return trails Small-Cap GI by > 10%-pts"
          - "Exit_On: EOD_Trailing_Stop (-15.0% from highest close, no intraday stops)"
          - "Time_Stop: 120 trading days if PnL < +5.0%"
          - "Partial_TP: Sell 50% at +25.0%"
          - "Runner_Rule: After Partial_TP, move stop to Break-Even (0.0%) and activate -15.0% EOD_Trailing_Stop"

    execution_constraints:
      allowed_order_types: ["LIMIT"]
      limit_price_buffer_pct: 0.2 # Buy Limit = Prev Close + 0.2%, Sell Limit = Prev Close - 0.2%
      market_regime_cash_buffer_pct: 40.0 # Hold 40% cash in CHOPPY/BEAR regimes
      portfolio_max_drawdown_alert_pct: -15.0 # Trigger full portfolio review alert
      max_new_buys_per_cycle: 1 # Max 1 new position per EOD cycle (staggered entry)
      min_days_between_buys: 3 # Minimum 3 calendar days between new active position buys
      max_new_buys_per_7d: 2 # Maximum 2 new active positions opened within any 7-day rolling window



