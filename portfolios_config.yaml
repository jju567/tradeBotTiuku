        allocated_capital: 5530
        slots: 3
        slot_sizes: [1850, 1850, 1830]
        universe_filter: "Nordic_MidCap_Compounder"
        rules:
          - "Exit_On: Quarterly_Fundamental_Breakdown"
          - "Catastrophic_Stop_Loss: -15.0% (or 2.5x ATR)"
          - "Partial_TP: Sell 50% at +25.0%"
          - "Runner_Rule: After Partial_TP, move stop to Break-Even (0.0%) and activate -15.0% Trailing_Stop"

      satellite_us_microcap_growth:
        allocated_capital: 1185
        slots: 1
        slot_sizes: [1185]
        universe_filter: "US_MicroCap_Growth"
        rules:
          - "Dividend_Yield: 0.0"
          - "Stop_Loss: -12.0% (or 2.5x ATR)" # Widened from -8% to survive micro-cap noise
          - "Time_Stop: 45 trading days if PnL < +5.0%"
          - "Partial_TP: Sell 50% at +25.0%"
          - "Runner_Rule: After Partial_TP, move stop to Break-Even (0.0%) and activate -15.0% Trailing_Stop"

      satellite_nordic_microcap_catalyst:
        allocated_capital: 1185
        slots: 1
        slot_sizes: [1185]
        universe_filter: "Nordic_MicroCap_Catalyst"
        rules:
          - "Stop_Loss: -12.0% (or 2.5x ATR)"
          - "Time_Stop: 45 trading days if PnL < +5.0%"
          - "Partial_TP: Sell 50% at +25.0%"
          - "Runner_Rule: After Partial_TP, move stop to Break-Even (0.0%) and activate -15.0% Trailing_Stop"

    execution_constraints:
      allowed_order_types: ["LIMIT"]
      limit_price_buffer_pct: 0.2 # Buy Limit = Prev Close + 0.2%, Sell Limit = Prev Close - 0.2%
      market_regime_cash_buffer_pct: 40.0 # Hold 40% cash in CHOPPY/BEAR regimes
      portfolio_max_drawdown_alert_pct: -15.0 # Trigger full portfolio review alert
      max_new_buys_per_cycle: 1 # Max 1 new position per EOD cycle (staggered entry)
      min_days_between_buys: 3 # Minimum 3 calendar days between new active position buys
      max_new_buys_per_7d: 2 # Maximum 2 new active positions opened within any 7-day rolling window



