    partial_take_profit: true
    take_profit_threshold_pct: 0.25   # +25% tuotto oston jälkeen laukaisee 50% osittaisen myynnin
    partial_sell_fraction: 0.50       # Myydään 50% positiosta
    partial_trailing_stop_pct: 0.15   # Jäljelle jäävä 50% roikkuu mukana -15% trailing stopilla

