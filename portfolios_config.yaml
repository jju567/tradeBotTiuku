  P12_Momentum_Breakout:
    strategy: "Momentum_Breakout"
    slots: 5
    slot_size: 2000
    start_cash: 10000
    volume_surge_multiplier: 3.0   # Today_Volume >= 3.0 * ADV_20d
    min_price_change_pct: 2.0      # Today_Return >= +2.0%
    min_adv_20d: 500000            # Kymmenkertaistettu ADV (500 000 USD/EUR) markkinavaikutuksen minimoimiseksi (<0.5% päivävaihdosta)
    min_adv: 500000
    order_type: "LIMIT"            # Ehdoton LIMIT-toimeksianto (kielletty MARKET)
    limit_buffer_pct: 0.002        # Max +0.2% edellisen kynttilän päätöskurssiin / VWAP
    time_in_force: "FOK_15MIN"     # 15 min aikaraja, jos hinta karkaa tilaus perutaan
    trailing_stop_pct: 0.06        # STRICT 6% trailing stop
    max_holding_days: 21           # Time stop
    require_nlp_clean: true        # Must bypass if NLP verdict is REJECT
    max_3d_runup_pct: 0.40         # Estä osto jos 3 päivän kumulatiivinen nousu > +40% (Exhaustion filter)
    max_rsi_14: 80.0               # Estä osto jos RSI14 > 80 (Overbought filter)

  P13_Live_Candidate:
    description: "Live 10k € Fundamental & Quality Portfolio (Manual EOD Execution)"
    start_cash: 10000
    sub_strategies:
      core_p5_nordic_quality:
        allocated_capital: 5000
        slots: 2
        slot_size: 2500
        rules:
          - "Nordic_Quality_Criteria"
          - "Stop_Loss: -12.0%"
          - "Partial_TP: 50% at +25.0%"
      core_p8_quality_growth:
        allocated_capital: 5000
        slots: 2
        slot_size: 2500
        rules:
          - "Quality_Growth_Criteria"
          - "Stop_Loss: -12.0%"
          - "Partial_TP: 50% at +25.0%"
    execution_constraints:
      allowed_order_types: ["LIMIT"]
      market_regime_cash_buffer_pct: 40.0 # Activates in CHOPPY/BEAR regimes


