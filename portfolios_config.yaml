          - "Dividend_Yield: 0.0"
          - "Exit_On: EOD_Trailing_Stop (-15.0% from highest close, no intraday stops)"
          - "Time_Stop: 45 trading days if PnL < +5.0%"
          - "Partial_TP: Sell 50% at +25.0%"
          - "Runner_Rule: After Partial_TP, move stop to Break-Even (0.0%) and activate -15.0% EOD_Trailing_Stop"

